name: Tests

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync --python 3.12
      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true
      - run: uv sync --python 3.12
      - run: uv run mypy listing_watch_notificators
      - run: uv run pylint listing_watch_notificators tests

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: [test, lint]
    uses: jprevc/workflows/.github/workflows/publish-pypi.yml@v1.2.0
    with:
      python-version: '3.12'
    secrets: inherit
